<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog - Cycling Matters</title>
  <link rel="stylesheet" href="styles.css" />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8XK3BHK2KQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-8XK3BHK2KQ');
  </script>
  <script src="main.js"></script>
</head>
<body>

  <!-- NAV -->
  <div id="site-nav"></div>

  <!-- BLOG LIST -->
  <div class="blog-container">
    <h1>Blog</h1>
    <div id="postList"></div>
  </div>

  <script>
    async function loadPosts() {
      try {
        const response = await fetch("./posts.json");
        const posts = await response.json();
        const list = document.getElementById("postList");
        posts.forEach(post => {
          const imageHTML = post.image
            ? `<img class="blog-card-image" src="${post.image}" alt="${post.title}" />`
            : "";
          list.innerHTML += `
            <a class="blog-card" href="post.html?id=${post.id}">
              ${imageHTML}
              <h2>${post.title}</h2>
              <div class="blog-date">${post.date}</div>
              <p>${post.excerpt}</p>
            </a>
          `;
        });
      } catch (error) {
        console.error("Unable to load posts:", error);
      }
    }
    loadPosts();
  </script>

</body>
</html>
