<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post - Cycling Matters</title>
  <link rel="stylesheet" href="styles.css" />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8XK3BHK2KQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-8XK3BHK2KQ');
  </script>
  <script src="main.js"></script>
</head>
<body>

  <!-- NAV -->
  <nav class="navbar">
    <div class="brand">
      <a href="index.html">Cycling Matters</a>
    </div>
    <div class="nav-links">
      <div class="nav-dropdown">
        <button class="nav-dropdown-trigger" aria-haspopup="true">
          Apps
        </button>
        <div class="nav-dropdown-menu" role="menu">
          <a href="mediamanager.html" target="_blank" role="menuitem">Media Manager</a>
          <a href="cyclereport.html" target="_blank" role="menuitem">CycleReport</a>
        </div>
      </div>
      <a href="blog.html">Blog</a>
      <a href="https://www.youtube.com/@CyclingMatters-ca" target="_blank">Videos</a>
      <a href="about.html">About</a>
    </div>
  </nav>

  <!-- POST -->
  <div class="post-container">
    <a class="post-back" href="blog.html">← Back to Blog</a>
    <div id="postContent"></div>
  </div>

  <script>
    async function loadPost() {
      try {
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");
        if (!id) { window.location.href = "blog.html"; return; }

        const response = await fetch("./posts.json");
        const posts = await response.json();
        const post = posts.find(p => p.id === id);
        if (!post) { window.location.href = "blog.html"; return; }

        document.title = `${post.title} - Cycling Matters`;

        const imageHTML = post.image
          ? `<img class="post-feature-image" src="${post.image}" alt="${post.title}" />`
          : "";

        document.getElementById("postContent").innerHTML = `
          ${imageHTML}
          <h1>${post.title}</h1>
          <div class="post-date">${post.date}</div>
          <div class="post-body">${post.content}</div>
        `;
      } catch (error) {
        console.error("Unable to load post:", error);
      }
    }
    loadPost();
  </script>

</body>
</html>
